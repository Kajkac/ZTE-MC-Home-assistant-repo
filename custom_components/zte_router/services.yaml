ubus_call:
  name: Call G5 Ultra ubus method
  description: Execute a ubus module/method on a configured G5 Ultra router entry.
  fields:
    entry_id:
      name: Entry ID
      description: Specific config entry ID when multiple routers are configured.
      example: 1234567890abcdef1234567890abcdef
      required: false
      selector:
        text:
    module:
      name: Module
      description: Ubus object (module) name to invoke.
      example: zwrt_wlan
      required: true
      selector:
        text:
    method:
      name: Method
      description: Method/function to call within the module.
      example: iface_report
      required: true
      selector:
        text:
    params:
      name: Parameters
      description: Optional JSON dictionary passed as params.
      example:
        source_module: web
        cid: 1
      required: false
      selector:
        object:

send_custom_sms:
  name: Send custom SMS
  description: Send an SMS with an arbitrary phone number and message through a configured router entry, independent of the pre-configured automation phone numbers.
  fields:
    entry_id:
      name: Entry ID
      description: Specific config entry ID when multiple routers are configured.
      example: 1234567890abcdef1234567890abcdef
      required: false
      selector:
        text:
    phone_number:
      name: Phone number
      description: Destination phone number.
      example: "+15555550100"
      required: false
      selector:
        text:
    phone:
      name: Phone (alias)
      description: Alias for phone_number. Provide either this or phone_number.
      example: "+15555550100"
      required: false
      selector:
        text:
    message:
      name: Message
      description: SMS message text to send.
      example: "Hello from Home Assistant"
      required: true
      selector:
        text:

set_network_mode:
  name: Set network mode (G5 Ultra, beta)
  description: Restrict the modem to a specific radio access technology. G5 Ultra only; not yet field-verified on all firmware.
  fields:
    entry_id:
      name: Entry ID
      description: Specific config entry ID when multiple routers are configured.
      required: false
      selector:
        text:
    mode:
      name: Mode
      description: Network mode to select.
      required: true
      selector:
        select:
          options:
            - "ONLY_3G"
            - "ONLY_4G"
            - "ONLY_5G"
            - "4G_AND_5G"

lock_cell:
  name: Lock cell (G5 Ultra, beta)
  description: Lock the modem to a specific 4G or 5G cell by PCI/EARFCN. G5 Ultra only; not yet field-verified on all firmware.
  fields:
    entry_id:
      name: Entry ID
      description: Specific config entry ID when multiple routers are configured.
      required: false
      selector:
        text:
    technology:
      name: Technology
      description: Which radio to lock.
      required: true
      selector:
        select:
          options:
            - "4g"
            - "5g"
    pci:
      name: PCI
      description: Physical Cell ID to lock to.
      required: true
      selector:
        text:
    earfcn:
      name: EARFCN / NR-ARFCN
      description: EARFCN (4g) or NR-ARFCN (5g) of the target cell.
      required: true
      selector:
        text:
    band:
      name: Band
      description: Required for technology "5g" only.
      required: false
      selector:
        text:

set_band_lock:
  name: Set band lock (G5 Ultra, beta)
  description: Restrict the modem to specific LTE or NR bands. G5 Ultra only; not yet field-verified on all firmware.
  fields:
    entry_id:
      name: Entry ID
      description: Specific config entry ID when multiple routers are configured.
      required: false
      selector:
        text:
    technology:
      name: Technology
      description: Which radio's band lock to set.
      required: true
      selector:
        select:
          options:
            - "4g"
            - "5g"
    band_mask:
      name: LTE band mask
      description: Required for technology "4g". Hex bitmask of allowed LTE bands.
      example: "0x87e28a0e00d7"
      required: false
      selector:
        text:
    nr_type:
      name: NR type
      description: Required for technology "5g".
      required: false
      selector:
        select:
          options:
            - "nsa"
            - "sa"
    bands:
      name: NR bands
      description: Required for technology "5g". Comma-separated NR band numbers.
      example: "78,3,1"
      required: false
      selector:
        text:

reset_band_cell_locks:
  name: Reset band/cell locks (G5 Ultra, beta)
  description: Clear any active band and cell locks, returning to automatic selection. G5 Ultra only.
  fields:
    entry_id:
      name: Entry ID
      description: Specific config entry ID when multiple routers are configured.
      required: false
      selector:
        text:

send_ussd:
  name: Send USSD code (G5 Ultra, beta)
  description: Send a USSD code (e.g. balance check) to the mobile network. G5 Ultra only; not yet field-verified on all firmware.
  fields:
    entry_id:
      name: Entry ID
      description: Specific config entry ID when multiple routers are configured.
      required: false
      selector:
        text:
    code:
      name: USSD code
      description: The USSD code to send.
      example: "*100#"
      required: true
      selector:
        text:

set_firewall:
  name: Set firewall (G5 Ultra, beta)
  description: Enable or disable the router's firewall. G5 Ultra only; not yet field-verified.
  fields:
    entry_id:
      name: Entry ID
      required: false
      selector:
        text:
    enable:
      name: Enable
      required: true
      selector:
        boolean:

set_nat:
  name: Set NAT (G5 Ultra, beta)
  description: Enable or disable NAT. G5 Ultra only; not yet field-verified.
  fields:
    entry_id:
      name: Entry ID
      required: false
      selector:
        text:
    enable:
      name: Enable
      required: true
      selector:
        boolean:

set_upnp:
  name: Set UPnP (G5 Ultra, beta)
  description: Enable or disable UPnP. G5 Ultra only; not yet field-verified.
  fields:
    entry_id:
      name: Entry ID
      required: false
      selector:
        text:
    enable:
      name: Enable
      required: true
      selector:
        boolean:

set_dmz:
  name: Set DMZ (G5 Ultra, beta)
  description: Enable or disable DMZ and set the forwarded host IP. G5 Ultra only; not yet field-verified.
  fields:
    entry_id:
      name: Entry ID
      required: false
      selector:
        text:
    enable:
      name: Enable
      required: true
      selector:
        boolean:
    dmz_ip:
      name: DMZ host IP
      description: Required when enabling DMZ.
      example: "192.168.0.50"
      required: false
      selector:
        text:

set_wan_dns:
  name: Set WAN DNS (G5 Ultra, beta)
  description: Configure the WAN DNS servers. G5 Ultra only; not yet field-verified.
  fields:
    entry_id:
      name: Entry ID
      required: false
      selector:
        text:
    mode:
      name: Mode
      required: true
      selector:
        select:
          options:
            - "auto"
            - "manual"
    prefer_dns:
      name: Primary DNS
      description: Required when mode is "manual".
      example: "1.1.1.1"
      required: false
      selector:
        text:
    standby_dns:
      name: Secondary DNS
      description: Required when mode is "manual".
      example: "8.8.8.8"
      required: false
      selector:
        text:

set_wan_mtu:
  name: Set WAN MTU (G5 Ultra, beta)
  description: Set the WAN interface MTU. G5 Ultra only; not yet field-verified.
  fields:
    entry_id:
      name: Entry ID
      required: false
      selector:
        text:
    mtu:
      name: MTU
      example: 1500
      required: true
      selector:
        number:
          min: 576
          max: 9000

set_ddns:
  name: Set DDNS (G5 Ultra, beta)
  description: Configure Dynamic DNS. G5 Ultra only; not yet field-verified.
  fields:
    entry_id:
      name: Entry ID
      required: false
      selector:
        text:
    enable:
      name: Enable
      required: true
      selector:
        boolean:
    service:
      name: Service
      description: Required when enabling DDNS.
      example: "dyndns"
      required: false
      selector:
        text:
    domain:
      name: Domain
      required: false
      selector:
        text:
    account:
      name: Account
      required: false
      selector:
        text:
    password:
      name: Password
      required: false
      selector:
        text:

set_apn_mode:
  name: Set APN mode (G5 Ultra, beta)
  description: Switch the APN between automatic and manual. G5 Ultra only; not yet field-verified.
  fields:
    entry_id:
      name: Entry ID
      required: false
      selector:
        text:
    mode:
      name: Mode
      required: true
      selector:
        select:
          options:
            - "auto"
            - "manual"

add_apn_profile:
  name: Add APN profile (G5 Ultra, beta)
  description: Add a manual APN profile. G5 Ultra only; not yet field-verified.
  fields:
    entry_id:
      name: Entry ID
      required: false
      selector:
        text:
    profile_name:
      name: Profile name
      required: true
      selector:
        text:
    apn:
      name: APN
      example: "internet"
      required: true
      selector:
        text:
    username:
      name: Username
      required: false
      selector:
        text:
    password:
      name: Password
      required: false
      selector:
        text:
    pdp_type:
      name: PDP type
      required: false
      selector:
        select:
          options:
            - "ipv4"
            - "ipv6"
            - "both"
    auth_mode:
      name: Auth mode
      required: false
      selector:
        select:
          options:
            - "none"
            - "pap"
            - "chap"
